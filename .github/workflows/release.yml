name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm -C apps/desktop install --frozen-lockfile
      # Missing secrets arrive as empty strings, and the bundler signs when a
      # variable merely exists, so only the ones that are set are passed on.
      - name: Pass on the Apple signing secrets that are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delim="END_$(uuidgen)"
              { printf '%s\n' "$name<<$delim" "$value" "$delim"; } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Rimix ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            See the "Install on a Mac" and "Install on Windows" sections of the README for how to install Rimix.
            The Mac build is signed only if Apple signing secrets were set for the repository; otherwise it is unsigned and macOS will warn on first open. The Windows installer is unsigned, so SmartScreen will warn on first run.
  # Runs after the Mac job so it adds its installer to the draft release that
  # job made: two jobs creating the draft at once can end up with two drafts.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Rimix ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            See the "Install on a Mac" and "Install on Windows" sections of the README for how to install Rimix.
            The Mac build is signed only if Apple signing secrets were set for the repository; otherwise it is unsigned and macOS will warn on first open. The Windows installer is unsigned, so SmartScreen will warn on first run.
