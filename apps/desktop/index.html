<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rimix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- symbols and the placeholder scene used by the connect screen backdrop -->
    <svg class="sprite" width="0" height="0" aria-hidden="true">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb7c9"/><stop offset="1" stop-color="#e3d9c6"/></linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c6168"/><stop offset="1" stop-color="#3a3e44"/></linearGradient>
    <linearGradient id="desk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a4a"/><stop offset="1" stop-color="#5b4430"/></linearGradient>
    <radialGradient id="face2" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#e8c3a6"/><stop offset="1" stop-color="#b98a6b"/></radialGradient>
    <g id="scene-copy">
      <rect width="1600" height="900" fill="url(#wall2)"/>
      <rect x="980" y="80" width="460" height="520" rx="8" fill="url(#sky2)"/>
      <rect x="1200" y="80" width="14" height="520" fill="#2b2e33"/>
      <rect x="980" y="330" width="460" height="12" fill="#2b2e33"/>
      <rect x="0" y="620" width="1600" height="280" fill="url(#desk2)"/>
      <rect x="300" y="560" width="220" height="130" rx="10" fill="#1d1f23"/>
      <rect x="312" y="572" width="196" height="106" rx="4" fill="#2f3f55"/>
      <ellipse cx="700" cy="620" rx="150" ry="60" fill="#2a2d33"/>
      <path d="M560 640 Q700 400 840 640 Z" fill="#2f5d8a"/>
      <circle cx="700" cy="400" r="95" fill="url(#face2)"/>
      <path d="M605 395 Q700 270 795 395 Q760 330 700 330 Q640 330 605 395 Z" fill="#2b2320"/>
      <rect x="1120" y="520" width="120" height="140" rx="4" fill="#4b5563"/>
      <circle cx="1180" cy="455" r="55" fill="#d8b36a" opacity="0.7"/>
    </g>
    <symbol id="minus" viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="plus" viewBox="0 0 10 10"><path d="M1.5 5h7M5 1.5v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="chl" viewBox="0 0 10 10"><path d="M6.5 1.5 3 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chr" viewBox="0 0 10 10"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="tick" viewBox="0 0 14 14"><path d="M3 7.5 6 10.5 11.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="cam" viewBox="0 0 20 20"><rect x="2" y="6" width="16" height="11" rx="3" fill="currentColor"/><rect x="6" y="3" width="6" height="4" rx="1.5" fill="currentColor"/><circle class="lens" cx="10" cy="11.5" r="3.4"/><circle cx="10" cy="11.5" r="1.7" fill="currentColor"/></symbol>
    <symbol id="gearglyph" viewBox="0 0 20 20"><path d="M8.6 2.5h2.8l.4 2.1 1.6.7 1.8-1.2 2 2-1.2 1.8.7 1.6 2.1.4v2.8l-2.1.4-.7 1.6 1.2 1.8-2 2-1.8-1.2-1.6.7-.4 2.1H8.6l-.4-2.1-1.6-.7-1.8 1.2-2-2 1.2-1.8-.7-1.6-2.1-.4V8.6l2.1-.4.7-1.6-1.2-1.8 2-2 1.8 1.2 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  </defs>
</svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
