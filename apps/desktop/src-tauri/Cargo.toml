[package]
name = "rimix-desktop"
version = "0.1.0"
description = "Rimix desktop app"
edition.workspace = true
license.workspace = true

[lib]
name = "rimix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sony-ptpip = { path = "../../../crates/sony-ptpip" }
rimix-wifi = { path = "../../../crates/rimix-wifi" }
rimix-sftp = { path = "../../../crates/rimix-sftp" }
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = { workspace = true }

[dev-dependencies]
sony-ptpip-sim = { path = "../../../crates/sony-ptpip-sim" }
tempfile = "3"
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
russh-sftp = "3"
